
name: Uni
version: '1.0.0'
main: ru.rosbiotech.schedule.UniversitySchedulePlugin
api-version: '1.21'
author: OpenAI
description: University timetable with GUI

commands:
  day:
    description: Open timetable for a date
    aliases: [d]
    usage: "/uni:day <today|tomorrow|yyyy-MM-dd>"
    permission: universityschedule.use

  week:
    description: Open weekly timetable
    aliases: [w]
    usage: "/uni:week <this|next|prev|number>"
    permission: universityschedule.use

  changes:
    description: Show recent timetable changes in chat
    aliases: [c]
    usage: "/uni:changes"
    permission: universityschedule.use

permissions:
  universityschedule.use:
    default: true
  universityschedule.notify:
    default: true
