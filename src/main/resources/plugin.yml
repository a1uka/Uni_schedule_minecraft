name: Uni
version: '1.0.0'
main: ru.rosbiotech.schedule.UniversitySchedulePlugin
api-version: '1.21'
author: OpenAI
description: University timetable

commands:
  day:
    description: Show timetable for a date
    aliases: [d]
    usage: "/day <now|tomorrow|yyyy-MM-dd>"
    permission: universityschedule.use

  week:
    description: Show a semester week
    aliases: [w]
    usage: "/week <this|next|prev|number>"
    permission: universityschedule.use

  changes:
    description: Show recent timetable changes
    aliases: [c]
    usage: "/changes"
    permission: universityschedule.use

permissions:
  universityschedule.use:
    default: true
  universityschedule.notify:
    default: true